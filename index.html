<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Sample Company</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Sample Company</h1>
        <nav>
            <a href="#about">会社概要</a>
            <a href="#services">サービス</a>
            <a href="#contact">お問い合わせ</a>
        </nav>
    </header>
    <section id="about">
        <h2>会社概要</h2>
        <p>ここに会社の概要文を記述します。</p>
    </section>
    <section id="services">
        <h2>サービス</h2>
        <ul>
            <li>サービスA</li>
            <li>サービスB</li>
            <li>サービスC</li>
        </ul>
    </section>
    <section id="contact">
        <h2>お問い合わせ</h2>
        <form id="contact-form">
            <input type="text" id="name" placeholder="お名前">
            <input type="email" id="email" placeholder="メールアドレス">
            <textarea id="message" placeholder="お問い合わせ内容"></textarea>
            <button type="submit">送信</button>
        </form>
    </section>
    <footer>
        <p>&copy; 2024 Sample Company</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
